# Runs the dictation storage and Syv.ai tests on Linux. The full app crate
# only builds on Windows, so this crate compiles the platform independent
# dictation files on their own (see src/lib.rs).
[package]
name = "dictation-tests"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
log = "0.4"
reqwest = { version = "0.11", features = ["multipart", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
tokio = { version = "1.32.0", features = ["full"] }

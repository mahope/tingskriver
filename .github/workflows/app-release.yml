name: GPUI app release (Velopack)

# Packs the GPUI app (crates/tingskriver-app) with Velopack: Tingskriver-Setup.exe,
# full and delta packages and the update feed releases.win.json (installer/README.md).
#
# - A tag app-v<version> creates a draft, promoted only after the gates pass. <version> must equal the
#   workspace version in Cargo.toml. Versions with a suffix (0.5.1-dev.1) become
#   pre-releases. The release is never marked "latest": the Tauri app's updater
#   reads releases/latest/download/latest.json, and it keeps doing so until the
#   move to Velopack (installer/README.md, "Overgang fra Tauri").
# - Branch pushes that touch the installer build the same files as an artifact,
#   without publishing.
#
# The Tauri app is still released from v* tags by release.yml.

on:
  push:
    tags:
      - 'app-v*'
    branches:
      - '**'
    # Not evaluated for tag pushes.
    paths:
      - 'installer/**'
      - '.github/workflows/app-release.yml'
      - '.github/workflows/velopack-package.yml'
      - 'crates/tingskriver-app/src/update.rs'
      - 'crates/tingskriver-core/src/install/**'
  workflow_dispatch:

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/velopack-package.yml
    with:
      release: ${{ github.ref_type == 'tag' }}

  draft:
    permissions:
      contents: write
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a main commit and changelog
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          test -s "docs/changelog/$VERSION.md"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: release-files
      - name: Create draft with changelog and installation notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
          PRERELEASE: ${{ needs.package.outputs.prerelease }}
        run: |
          set -euo pipefail
          cat "docs/changelog/$VERSION.md" installer/release-notes.md > release-notes.md
          flags=(--draft --latest=false --title "Tingskriver $VERSION (ny app)" --notes-file release-notes.md --verify-tag)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" release-files/*

  performance:
    needs: [package, draft]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test performance gate and README figures
        run: |
          set -euo pipefail
          python3 scripts/tests/test_ydeevne_port.py
          python3 scripts/ydeevne-port.py --tjek-readme
      - name: Require the stable reference measurement
        if: needs.package.outputs.prerelease != 'true'
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: python3 scripts/ydeevne-port.py "docs/changelog/$VERSION.performance.json" --profil release

  smoke:
    needs: [package, draft]
    uses: ./.github/workflows/installer-smoke.yml
    with:
      package-artifact: ${{ needs.package.outputs.artifact }}

  publish:
    permissions:
      contents: write
    needs: [package, draft, performance, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote only a draft on main
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          test -s "docs/changelog/$VERSION.md"
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false

  update-smoke:
    name: Published update reaches the installed predecessor
    needs: [package, publish]
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download the previous installer in the same update channel
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          tag=$(python scripts/previous-release.py "$VERSION" < releases.json)
          echo "version=${tag#app-v}" >> "$GITHUB_OUTPUT"
          gh release download "$tag" --pattern Tingskriver-Setup.exe --dir previous
      - name: Install predecessor and require the published update
        shell: pwsh
        env:
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          # Exercise the installed app's anonymous GitHub source, without an override.
          Remove-Item Env:TINGSKRIVER_UPDATE_FEED -ErrorAction SilentlyContinue
          ./installer/smoke-test.ps1 -PreviousVersion -Setup previous/Tingskriver-Setup.exe -OutputDir update-smoke-out -ExpectedInstalledVersion $env:PREVIOUS_VERSION -ExpectedUpdateVersion $env:VERSION
      - name: Upload update smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: published-update-smoke-files
          path: update-smoke-out/*
          if-no-files-found: warn
          retention-days: 30

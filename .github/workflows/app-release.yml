name: GPUI app release (Velopack)

# Packs the GPUI app (crates/tingskriver-app) with Velopack: Tingskriver-Setup.exe,
# full and delta packages and the update feed releases.win.json (installer/README.md).
#
# - A tag app-v<version> publishes a GitHub Release. <version> must equal the
#   workspace version in Cargo.toml. Versions with a suffix (0.5.1-dev.1) become
#   pre-releases. The release is never marked "latest": the Tauri app's updater
#   reads releases/latest/download/latest.json, and it keeps doing so until the
#   move to Velopack (installer/README.md, "Overgang fra Tauri").
# - Branch pushes that touch the installer build the same files as an artifact,
#   without publishing.
#
# The Tauri app is still released from v* tags by release.yml.

on:
  push:
    tags:
      - 'app-v*'
    branches:
      - '**'
    # Not evaluated for tag pushes.
    paths:
      - 'installer/**'
      - '.github/workflows/app-release.yml'
      - 'crates/tingskriver-app/src/update.rs'
      - 'crates/tingskriver-core/src/install/**'
  workflow_dispatch:

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Keep equal to the velopack crate in crates/tingskriver-app/Cargo.toml.
  VPK_VERSION: 1.2.161

jobs:
  package:
    name: Velopack package (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      # sqlx checks migration checksums; CRLF checkouts break them (upstream #843).
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "tingskriver-app") | .version')"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::Could not read the version of tingskriver-app"
            exit 1
          fi
          publish=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            publish=true
            if [ "$GITHUB_REF_NAME" != "app-v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $version (expected app-v$version). Bump version in Cargo.toml first."
              exit 1
            fi
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Version $version, publish $publish, pre-release $prerelease"

      # Same portable CPU baseline as the Tauri installer (docs/BUILDING.md).
      - name: Configure portable build
        shell: pwsh
        run: |
          $cmakeHook = (Join-Path $env:GITHUB_WORKSPACE ".github/force-portable-ggml.cmake").Replace('\', '/')
          "CMAKE_PROJECT_INCLUDE=$cmakeHook" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTFLAGS=-C target-cpu=x86-64-v2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          prefix-key: tingskriver-windows-velopack-v1

      - name: Build tingskriver-app (release)
        shell: bash
        run: .github/scripts/annotate-errors.sh cargo build --release --locked -p tingskriver-app

      - name: Verify portable Whisper build
        run: node .github/verify-portable-ggml.cjs target/release

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install vpk
        shell: bash
        run: dotnet tool install -g vpk --version "$VPK_VERSION"

      # The newest published version's full package lets vpk build a delta
      # (branch builds too, so their artifacts can be tested as an update).
      # Before the first release there is none; then only the full package.
      - name: Download previous release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p installer/Releases
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --channel win --pre \
            --token "$GITHUB_TOKEN" --outputDir installer/Releases \
            || echo "::notice::No earlier Velopack release found; publishing a full package only"

      - name: Pack
        shell: pwsh
        run: |
          ./installer/pack.ps1 -Version "${{ steps.version.outputs.version }}" -Exe target/release/tingskriver-app.exe
          Get-Content -Raw installer/Releases/upload/releases.win.json

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: tingskriver-app-velopack-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: installer/Releases/upload/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Den nye Tingskriver (GPUI) til Windows, version $VERSION."
            echo
            echo "Hent \`Tingskriver-Setup.exe\` nedenfor. Installationen kræver ikke administrator og lægger programmet i din egen brugermappe. Installeren er ikke kodesigneret, så Windows SmartScreen advarer første gang (\"Flere oplysninger\" og derefter \"Kør alligevel\")."
            echo
            echo "Installerede versioner henter selv opdateringer og installerer dem, næste gang programmet starter."
          } > "$notes"
          flags=(--latest=false --title "Tingskriver $VERSION (ny app)" --notes-file "$notes" --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" installer/Releases/upload/*

name: Branch build

# Every push to a branch other than main builds the Windows installer
# (no release) so the branch can be verified and tested. Pushes that only
# change site/, docs/ and the like skip the builds (.github/scripts/ci-scope.py;
# a skipped job counts as passed).

on:
  push:
    branches-ignore:
      - main

concurrency:
  group: branch-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Change scope
    runs-on: ${{ (github.event_name == 'push' && vars.LINUX_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does this change need the builds?
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: >-
          python3 .github/scripts/ci-scope.py
          --event-name "$EVENT_NAME" --ref-name "$REF_NAME" --ref-type "$REF_TYPE"

  windows:
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    uses: ./.github/workflows/windows-build.yml
    with:
      release: false
    secrets: inherit

  # The device switching logic is plain std; compiling it on its own keeps
  # it that way (tingskriver-core runs the same tests in rust.yml).
  device-follow-tests:
    name: Device switching unit tests
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ${{ (github.event_name == 'push' && vars.LINUX_RUNNER) || 'ubuntu-latest' }}
    # A hanging test binary must not hold the self-hosted runner for the 6 h default.
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Run tests
        run: |
          rustc --edition 2021 --test crates/tingskriver-core/src/audio/device_follow.rs -o "$RUNNER_TEMP/device_follow_tests"
          "$RUNNER_TEMP/device_follow_tests"

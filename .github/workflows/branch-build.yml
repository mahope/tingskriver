name: Branch build

# Every push to a branch other than main builds the Windows installer
# (no release) so the branch can be verified and tested.

on:
  push:
    branches-ignore:
      - main

concurrency:
  group: branch-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/windows-build.yml
    with:
      release: false
    secrets: inherit

  # The device switching logic is plain std; compiling it on its own keeps
  # it that way (tingskriver-core runs the same tests in rust.yml).
  device-follow-tests:
    name: Device switching unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: |
          rustc --edition 2021 --test crates/tingskriver-core/src/audio/device_follow.rs -o "$RUNNER_TEMP/device_follow_tests"
          "$RUNNER_TEMP/device_follow_tests"

name: Android

on:
  push:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Debug APK, JVM tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint debug app
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tingskriver-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tingskriver-android-reports
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
          if-no-files-found: warn

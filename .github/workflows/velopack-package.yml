name: Build Velopack package

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    outputs:
      version:
        value: ${{ jobs.package.outputs.version }}
      prerelease:
        value: ${{ jobs.package.outputs.prerelease }}
      artifact:
        value: ${{ jobs.package.outputs.artifact }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  VPK_VERSION: 1.2.161

jobs:
  package:
    name: Velopack package (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      artifact: tingskriver-app-velopack-${{ steps.version.outputs.version }}-${{ github.sha }}
    steps:
      # sqlx checks migration checksums; CRLF checkouts break them (upstream #843).
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "tingskriver-app") | .version')"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::Could not read the version of tingskriver-app"
            exit 1
          fi
          publish=false
          if [ "${{ inputs.release }}" = "true" ]; then
            publish=true
            if [ "$GITHUB_REF_NAME" != "app-v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $version (expected app-v$version). Bump version in Cargo.toml first."
              exit 1
            fi
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Version $version, publish $publish, pre-release $prerelease"

      # Same portable CPU baseline as the Tauri installer (docs/BUILDING.md).
      - name: Configure portable build
        shell: pwsh
        run: |
          $cmakeHook = (Join-Path $env:GITHUB_WORKSPACE ".github/force-portable-ggml.cmake").Replace('\', '/')
          "CMAKE_PROJECT_INCLUDE=$cmakeHook" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTFLAGS=-C target-cpu=x86-64-v2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          prefix-key: tingskriver-windows-velopack-v1

      - name: Build tingskriver-app (release)
        shell: bash
        run: .github/scripts/annotate-errors.sh cargo build --release --locked -p tingskriver-app -p tingskriver-core -p tingskriver-mcp --bin tingskriver-app --bin tingskriver-stt --bin tingskriver-mcp

      # Same pinned runtime and archive checksum as the Tauri bundler.
      - name: Stage ONNX Runtime for the isolated speech worker
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "tingskriver-onnx.zip"
          Invoke-WebRequest "https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-win-x64-1.22.0.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "174c616efc0271194488642a72f1a514e01487da4dfe84c49296d66e40ebe0da") { throw "ONNX Runtime checksum mismatch" }
          Expand-Archive $archive -DestinationPath (Join-Path $env:RUNNER_TEMP "tingskriver-onnx") -Force
          $runtime = Join-Path $env:RUNNER_TEMP "tingskriver-onnx/onnxruntime-win-x64-1.22.0"
          Copy-Item "$runtime/lib/onnxruntime.dll","$runtime/lib/onnxruntime_providers_shared.dll" target/release/
          Copy-Item "$runtime/LICENSE" target/release/onnxruntime-LICENSE.txt

      - name: Verify portable Whisper build
        run: node .github/verify-portable-ggml.cjs target/release

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install vpk
        shell: bash
        run: dotnet tool install -g vpk --version "$VPK_VERSION"

      # Only releases build deltas; unpublished builds may have the same or
      # an older version than the newest published package, which vpk rejects.
      # Before the first release there is none; then only the full package.
      - name: Download previous release
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p installer/Releases
          # Only "no earlier release" may skip the delta; any other failure
          # (network, API) fails the job instead of silently dropping it.
          earlier=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft == false) | select(.tagName | startswith("app-v"))] | length')
          if [ "$earlier" = "0" ]; then
            echo "::notice::No earlier Velopack release found; publishing a full package only"
          else
            vpk download github --repoUrl "https://github.com/${{ github.repository }}" --channel win --pre \
              --token "$GITHUB_TOKEN" --outputDir installer/Releases
          fi

      - name: Pack
        shell: pwsh
        run: |
          ./installer/pack.ps1 -Version "${{ steps.version.outputs.version }}" -Exe target/release/tingskriver-app.exe -Extra target/release/tingskriver-stt.exe,target/release/tingskriver-mcp.exe,target/release/onnxruntime.dll,target/release/onnxruntime_providers_shared.dll,target/release/onnxruntime-LICENSE.txt
          Get-Content -Raw installer/Releases/upload/releases.win.json

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: tingskriver-app-velopack-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: installer/Releases/upload/*
          if-no-files-found: error
          retention-days: 30


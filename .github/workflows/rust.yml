name: Rust

# Builds and tests the Cargo workspace on every push. Windows builds the
# whole workspace (core, GPUI app, overlay, Tauri crate) and a release build
# of the GPUI app as an artifact; Linux runs the platform independent tests
# in tingskriver-core and checks the crate boundaries and the GPUI version
# lock. Agents read the result with scripts/ci-status.sh.
#
# Scope: a push to main always runs everything (the automatic release needs a
# successful Rust run for every commit on main). On other branches the "scope"
# job skips the builds when only site/, docs/ and the like changed
# (.github/scripts/ci-scope.py). A skipped job counts as passed.
# Lint: rustfmt on changed files only and clippy -D warnings on the crates in
# .github/clippy-crates.txt (docs/agenter.md).

on:
  push:
  workflow_dispatch:

concurrency:
  # Every main commit gets its own group, so merges in a row run side by side
  # instead of waiting (or, from the third one, being dropped from the queue).
  # On other branches only the tip matters, so a newer push cancels the older run.
  group: rust-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  scope:
    name: Change scope
    runs-on: ${{ (github.event_name == 'push' && vars.LINUX_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does this change need the Rust builds?
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: >-
          python3 .github/scripts/ci-scope.py
          --event-name "$EVENT_NAME" --ref-name "$REF_NAME" --ref-type "$REF_TYPE"

  # Scheduled and reusable workflows are not exercised by pull request CI; a
  # missing token permission only shows up at the next cron run (#192). Runs on
  # every push, also when only .github/ changed.
  workflows:
    name: Workflow permissions and schedules
    runs-on: ${{ (github.event_name == 'push' && vars.LINUX_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure PyYAML
        run: python3 -c "import yaml" 2>/dev/null || sudo apt-get install -y --no-install-recommends python3-yaml

      - name: Check workflows
        run: |
          python3 scripts/check-workflows.py
          python3 scripts/tests/test_check_workflows.py
          python3 scripts/tests/test_previous_release.py

  # Fast Linux gate on the changed files only. Files nobody touched may stay
  # unformatted; main compares with the previous tip of main.
  lint:
    name: Format (changed files) and clippy (listed crates)
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ${{ (github.event_name == 'push' && vars.LINUX_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev cmake clang

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: 'false'
          prefix-key: tingskriver-linux-lint-v1

      - name: rustfmt on changed files
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_NAME" = "main" ]; then
            base="$BEFORE"
            if [ -z "$base" ] || [ "${base//0/}" = "" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="HEAD~1"
            fi
          else
            git fetch --no-tags --quiet origin main
            base="origin/main"
          fi
          .github/scripts/check-fmt-changed.sh "$base"

      - name: clippy -D warnings on the listed crates
        run: .github/scripts/annotate-errors.sh .github/scripts/clippy-ratchet.sh

      - name: Test the CI scope and format gate scripts
        run: |
          python3 scripts/tests/test_ci_scope.py
          bash scripts/tests/test_fmt_changed.sh

  windows:
    name: Windows workspace build and tests
    # Starts with lint, not after it: the Windows jobs are the longest path to a
    # green main and a release. See docs/ci.md for the runner-queue trade-off.
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # sqlx checks migration checksums; CRLF checkouts break them (upstream #843).
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: 'false'
          prefix-key: tingskriver-windows-test-v1

      - name: Cache FFmpeg binary
        uses: actions/cache@v4
        with:
          path: frontend/src-tauri/binaries/ffmpeg-*.exe
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('frontend/src-tauri/build.rs', 'frontend/src-tauri/build/ffmpeg.rs') }}

      - name: Cache Windows ONNX Runtime
        uses: actions/cache@v4
        with:
          path: frontend/src-tauri/binaries/onnxruntime
          key: ${{ runner.os }}-onnxruntime-x86_64-pc-windows-msvc-${{ hashFiles('frontend/src-tauri/build/onnxruntime.rs') }}

      # tauri-build checks that every externalBin exists. The real sidecar is
      # only needed in the installer, so an empty placeholder is enough here.
      - name: Placeholder llama-helper sidecar
        shell: bash
        run: |
          mkdir -p frontend/src-tauri/binaries
          touch frontend/src-tauri/binaries/llama-helper-x86_64-pc-windows-msvc.exe

      # tauri-build copies staged sidecars into target/debug. An empty STT
      # placeholder would overwrite the real worker used by integration tests.
      - name: Stage real STT worker
        shell: bash
        run: |
          cargo build --locked -p tingskriver-core --bin tingskriver-stt
          cp target/debug/tingskriver-stt.exe frontend/src-tauri/binaries/tingskriver-stt-x86_64-pc-windows-msvc.exe
          cargo build --locked -p tingskriver-mcp
          cp target/debug/tingskriver-mcp.exe frontend/src-tauri/binaries/tingskriver-mcp-x86_64-pc-windows-msvc.exe

      - name: Build workspace
        shell: bash
        run: .github/scripts/annotate-errors.sh cargo build --workspace --locked

      # Runs the test binaries and their tests in parallel, each test in its own
      # process. Tests that share the desktop run one at a time
      # (.config/nextest.toml, docs/testing.md).
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # ort loads ONNX Runtime dynamically on Windows. The app points it at the
      # bundled DLL at startup; tests use the DLL the Tauri build script
      # downloaded instead of an older one from System32. The runner has no
      # audio output device, so the playback device test only runs on Linux
      # and on real machines.
      - name: Test workspace
        shell: bash
        env:
          ORT_DYLIB_PATH: ${{ github.workspace }}\frontend\src-tauri\binaries\onnxruntime\onnxruntime.dll
        run: >-
          .github/scripts/annotate-errors.sh cargo nextest run --workspace --locked
          --profile ci --no-output-indent
          --exclude tingskriver-host --
          --skip audio::playback_monitor::tests::test_get_output_device

      # nextest does not run doctests.
      - name: Doctests workspace
        if: ${{ !cancelled() }}
        shell: bash
        env:
          ORT_DYLIB_PATH: ${{ github.workspace }}\frontend\src-tauri\binaries\onnxruntime\onnxruntime.dll
        run: >-
          .github/scripts/annotate-errors.sh cargo test --doc --workspace --locked --no-fail-fast
          --exclude tingskriver-host

      # The host's tests register system-wide shortcuts and a tray icon; one at
      # a time, with output, so a crash shows which test was running
      # (--no-capture runs one test at a time and passes the output through).
      - name: Test tingskriver-host
        if: ${{ !cancelled() }}
        shell: bash
        env:
          ORT_DYLIB_PATH: ${{ github.workspace }}\frontend\src-tauri\binaries\onnxruntime\onnxruntime.dll
        run: |
          .github/scripts/annotate-errors.sh cargo nextest run --locked -p tingskriver-host --profile ci --no-capture
          .github/scripts/annotate-errors.sh cargo test --doc --locked -p tingskriver-host

  linux-core:
    name: Core tests and crate boundaries (Linux)
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ${{ (github.event_name == 'push' && vars.LINUX_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev cmake clang ffmpeg python3-jsonschema

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: 'false'
          prefix-key: tingskriver-linux-core-v1

      # tingskriver-core must stay free of UI crates (docs/arkitektur.md).
      - name: Core has no UI dependencies
        shell: bash
        run: |
          set -euo pipefail
          tree="$(cargo tree --locked -p tingskriver-core -e normal,build --prefix none --target all)"
          if echo "$tree" | grep -E '^(tauri|tauri-[a-z-]+|gpui|gpui-[a-z-]+|wry|webview2[a-z-]*) v'; then
            echo "::error::tingskriver-core depends on a UI crate (see the lines above)"
            exit 1
          fi
          echo "tingskriver-core has no tauri, gpui, wry or webview2 dependency"

      # One GPUI version, the one gpui-component's own Cargo.lock uses
      # (docs/gpui.md). Mixed versions fail with E0277 far from the cause.
      - name: GPUI version lock
        run: python3 scripts/check-gpui-lock.py

      - name: GPUI design document
        run: python3 scripts/check-design-doc.py

      # Parallel test binaries and tests, each test in its own process
      # (.config/nextest.toml, docs/testing.md). nextest does not run
      # doctests, so they run with cargo test --doc.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Test tingskriver-core
        run: |
          .github/scripts/annotate-errors.sh cargo nextest run --locked -p tingskriver-core --profile ci --no-output-indent
          .github/scripts/annotate-errors.sh cargo test --doc --locked -p tingskriver-core

      - name: Test MCP stdio server
        run: .github/scripts/annotate-errors.sh cargo nextest run --locked -p tingskriver-mcp --profile ci --no-output-indent
      - name: Verify core I/O lint rejects blocking calls
        run: bash scripts/check-async-io-guard.sh

      - name: Check delivery schema version
        run: |
          python3 scripts/tests/test_delivery_schema_version.py
          python3 scripts/check-delivery-schema-version.py --base origin/main

      - name: Validate published delivery schema
        run: /usr/bin/python3 scripts/tests/test_delivery_schema.py

      - name: Test recording soak verifier
        run: .github/scripts/annotate-errors.sh cargo nextest run --locked -p tingskriver-core --example recording_soak --profile ci --no-output-indent

      # Pilot tones through the production capture and writer; leakage between
      # the microphone and system tracks fails the job (#189, docs/recording-soak.md).
      - name: Channel isolation on the synthetic device
        run: >-
          cargo run --locked -p tingskriver-core --example recording_soak --
          isolation "$RUNNER_TEMP/isolation" 2 docs/kanalisolation-graenser.json

      # Leaking WAV fixtures must fail and clean ones pass, through the CLI.
      - name: Channel isolation tool on WAV fixtures
        run: |
          cargo build --locked -p tingskriver-core --example kanalisolation
          KANALISOLATION_BINARY=target/debug/examples/kanalisolation python3 -I scripts/tests/test_kanalisolation.py

      # The overlay's state model, layout and renderer are platform independent.
      - name: Test tingskriver-overlay
        run: |
          .github/scripts/annotate-errors.sh cargo nextest run --locked -p tingskriver-overlay --profile ci --no-output-indent
          .github/scripts/annotate-errors.sh cargo test --doc --locked -p tingskriver-overlay

      # The host's bridge, tray status, icon, shortcut registry and watchers.
      - name: Test tingskriver-host
        run: |
          .github/scripts/annotate-errors.sh cargo nextest run --locked -p tingskriver-host --profile ci --no-output-indent
          .github/scripts/annotate-errors.sh cargo test --doc --locked -p tingskriver-host

  # Release build of the GPUI app for the manual Windows tests in
  # docs/gpui.md (text input, IME, UI Automation, DPI, start time, no GPU).
  windows-gpui-app:
    name: GPUI app artifact (Windows release)
    # Starts with lint, not after it: the Windows jobs are the longest path to a
    # green main and a release. See docs/ci.md for the runner-queue trade-off.
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@1.99.1

      # Same portable CPU baseline and cache as velopack-package.yml, so this
      # job builds what ships and keeps the release build's cache warm on main.
      - name: Configure portable build
        shell: pwsh
        run: |
          $cmakeHook = (Join-Path $env:GITHUB_WORKSPACE ".github/force-portable-ggml.cmake").Replace('\', '/')
          "CMAKE_PROJECT_INCLUDE=$cmakeHook" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTFLAGS=-C target-cpu=x86-64-v2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: 'false'
          prefix-key: tingskriver-windows-gpui-release-v2
          shared-key: windows-gpui-release

      - name: Build tingskriver-app (release)
        shell: bash
        run: .github/scripts/annotate-errors.sh cargo build --release --locked -p tingskriver-app -p tingskriver-core -p tingskriver-mcp --bin tingskriver-app --bin tingskriver-stt --bin tingskriver-mcp

      # Same pinned runtime and archive checksum as the Tauri bundler.
      - name: Stage ONNX Runtime for the isolated speech worker
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "tingskriver-onnx.zip"
          Invoke-WebRequest "https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-win-x64-1.22.0.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "174c616efc0271194488642a72f1a514e01487da4dfe84c49296d66e40ebe0da") { throw "ONNX Runtime checksum mismatch" }
          Expand-Archive $archive -DestinationPath (Join-Path $env:RUNNER_TEMP "tingskriver-onnx") -Force
          $runtime = Join-Path $env:RUNNER_TEMP "tingskriver-onnx/onnxruntime-win-x64-1.22.0"
          Copy-Item "$runtime/lib/onnxruntime.dll","$runtime/lib/onnxruntime_providers_shared.dll" target/release/
          Copy-Item "$runtime/LICENSE" target/release/onnxruntime-LICENSE.txt

      - name: Upload GPUI app and speech runtime
        uses: actions/upload-artifact@v4
        with:
          name: tingskriver-app-windows-x64
          path: |
            target/release/tingskriver-app.exe
            target/release/tingskriver-stt.exe
            target/release/tingskriver-mcp.exe
            target/release/onnxruntime.dll
            target/release/onnxruntime_providers_shared.dll
            target/release/onnxruntime-LICENSE.txt
          if-no-files-found: error
          retention-days: 30

  # Licence and ban rules for every Cargo dependency (deny.toml). A GPL or
  # LGPL crate anywhere in the tree fails this job.
  cargo-deny:
    name: Dependency licences (cargo deny)
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ${{ (github.event_name == 'push' && vars.LINUX_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny check
        run: cargo deny --locked check licenses bans

  # The same Windows type-check agents run on Linux (docs/BUILDING.md). The
  # Tauri crate is left out: its build script runs the downloaded ffmpeg.exe.
  xwin-check:
    name: Windows check from Linux (cargo xwin)
    # Pinned so the LLVM 19 packages below exist.
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ${{ (github.event_name == 'push' && vars.LINUX_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-pc-windows-msvc

      # The MSVC STL that cargo-xwin downloads needs Clang 19 or newer.
      - name: Install LLVM 19, lld and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 llvm-19 lld-19 ninja-build cmake
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"

      - name: Install cargo-xwin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin

      - name: Cache Windows SDK and CRT
        uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-sdk-v1

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: 'false'
          prefix-key: tingskriver-xwin-v1

      - name: cargo xwin check
        run: .github/scripts/annotate-errors.sh cargo xwin check --locked --target x86_64-pc-windows-msvc -p tingskriver-core -p tingskriver-overlay -p tingskriver-host -p tingskriver-app

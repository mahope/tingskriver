name: Android benchmark contract
on:
  push:
    paths:
      - 'scripts/android-benchmark/**'
      - 'docs/android/**'
      - '.github/workflows/android-benchmark.yml'
  pull_request:
    paths:
      - 'scripts/android-benchmark/**'
      - 'docs/android/**'
      - '.github/workflows/android-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Compile benchmark tools
        run: python3 -m compileall -q scripts/android-benchmark
      - name: Test scoring and rejection controls (synthetic text only)
        run: python3 -m unittest discover -s scripts/android-benchmark -v
      - name: Check patch whitespace
        run: git diff --check
      - name: Fetch existing locked native dependencies
        run: cargo fetch --locked
      - name: Build and smoke-test native driver on host
        shell: bash
        run: |
          set -euo pipefail
          source_dir=$(find "$HOME/.cargo/registry/src" -path '*/whisper-rs-sys-0.11.1/whisper.cpp' -type d -print -quit)
          test -n "$source_dir"
          cmake -S scripts/android-benchmark/native -B /tmp/benchmark-host -DWHISPER_SOURCE="$source_dir" -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build /tmp/benchmark-host --parallel 2
          python3 scripts/android-benchmark/smoke_native.py /tmp/benchmark-host/driver
      - name: Cross-compile native driver for arm64 Android
        shell: bash
        run: |
          set -euo pipefail
          source_dir=$(find "$HOME/.cargo/registry/src" -path '*/whisper-rs-sys-0.11.1/whisper.cpp' -type d -print -quit)
          test -n "$source_dir"
          ndk_dir=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -f "$ndk_dir/build/cmake/android.toolchain.cmake"
          cat "$ndk_dir/source.properties"
          cmake -S scripts/android-benchmark/native -B /tmp/benchmark-arm64 -DWHISPER_SOURCE="$source_dir" -DCMAKE_TOOLCHAIN_FILE="$ndk_dir/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build /tmp/benchmark-arm64 --parallel 2

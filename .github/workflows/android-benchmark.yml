name: Android benchmark contract
on:
  push:
    paths:
      - 'scripts/android-benchmark/**'
      - 'docs/android/**'
      - '.github/workflows/android-benchmark.yml'
  pull_request:
    paths:
      - 'scripts/android-benchmark/**'
      - 'docs/android/**'
      - '.github/workflows/android-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Compile benchmark tools
        run: python3 -m compileall -q scripts/android-benchmark
      - name: Test scoring and rejection controls (synthetic text only)
        run: python3 -m unittest discover -s scripts/android-benchmark -v
      - name: Check patch whitespace
        run: git diff --check

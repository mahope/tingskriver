name: Release

# Pushing a tag like v0.5.0-dev.1 builds the Windows installer, signs the
# updater artifacts and publishes a GitHub Release with latest.json.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    uses: ./.github/workflows/windows-build.yml
    with:
      release: true
    secrets: inherit

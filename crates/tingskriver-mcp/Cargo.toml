[package]
name = "tingskriver-mcp"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
publish = false

[dependencies]
tingskriver-core = { path = "../tingskriver-core" }
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io"] }
serde.workspace = true
serde_json.workspace = true

[package]
name = "tingskriver-host"
description = "Tingskriver: vært for tastaturhook, globale genveje og tray uden for GPUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
tingskriver-core = { path = "../tingskriver-core" }
tingskriver-overlay = { path = "../tingskriver-overlay" }
log = "0.4"
serde_json = { workspace = true }
tokio = { workspace = true }
# Draws the tray icon (app icon plus a status dot) from the overlay's tokens.
tiny-skia = "0.11"

[target.'cfg(windows)'.dependencies]
# The version the Tauri crate already uses (same lockfile entry).
tray-icon = { version = "0.23.1", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { workspace = true }

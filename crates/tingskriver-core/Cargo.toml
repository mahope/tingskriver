[package]
name = "tingskriver-core"
description = "Tingskriver: lyd, transskription, database, udbydere og diktering uden UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0"
posthog-rs = "0.3.7"
async-trait = "0.1"
bytemuck = "1.16.1"
dashmap = "6.1.0"
ebur128 = "0.1"
ffmpeg-sidecar = { git = "https://github.com/nathanbabcock/ffmpeg-sidecar", branch = "main" }
futures-channel = "0.3.31"
nnnoiseless = "0.5"
rand = "0.8.5"
rayon = "1.10"
realfft = "3.4.0"
ringbuf = "0.4.8"
rubato = "0.15.0"
silero_rs = { git = "https://github.com/emotechlab/silero-rs", rev = "26a6460", package = "silero" }
symphonia = { version = "0.5.4", features = ["aac", "isomp4", "mp3", "flac", "ogg", "vorbis", "pcm", "wav", "opt-simd"] }
tempfile = "3.3.0"
which = "6.0.1"
futures-util = "0.3"
log = "0.4"
once_cell = "1.17.1"
regex = "1.11.0"
reqwest = { version = "0.11", features = ["blocking", "multipart", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32.0", features = ["full", "tracing"] }
tracing = "0.1.40"
chrono = { version = "0.4.31", features = ["serde"] }
sqlx = { version = "0.8", features = [ "runtime-tokio", "sqlite", "chrono"] }
tokio-util = "0.7"
uuid = { version = "1.0", features = ["v4", "serde"] }
dirs = "5.0.1"
lazy_static = { version = "1.4.0" }
whatlang = "0.16.4"
cpal = "0.15.3"
crossbeam = "0.8.4"
ndarray = "0.16"
ort = { version = "2.0.0-rc.10" }  # ONNX Runtime for Parakeet models
sysinfo = "0.32"
thiserror = "2.0.16"

[features]
# GPU/BLAS backends for whisper-rs; the Tauri crate forwards its features here.
metal = ["whisper-rs/metal"]
coreml = ["whisper-rs/coreml"]
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
hipblas = ["whisper-rs/hipblas"]
openblas = ["whisper-rs/openblas"]
openmp = ["whisper-rs/openmp"]

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.13.2", features = ["raw-api", "metal", "coreml"] }
objc = "0.2.7"
core-graphics = "0.23"
cidre = { git = "https://github.com/yury/cidre", rev = "a9587fa", features = ["av"] }
dasp = "0.11.0"

[target.'cfg(target_os = "windows")'.dependencies]
whisper-rs = { version = "0.13.2", features = ["raw-api"] }
ort = { version = "2.0.0-rc.10", features = ["load-dynamic"] }
# IMMNotificationClient for following default audio devices (same versions tauri already uses)
windows = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com",
    # Dictation: keyboard hook, SendInput, clipboard, foreground app, Credential Manager, overlay
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi",
    "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole",
    "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Security_Credentials",
    "Win32_Graphics_Gdi",
    # Dictation: which field inside a browser or Electron app has focus ("slet det")
    "Win32_UI_Accessibility",
] }
windows-core = "0.61"

[target.'cfg(target_os = "linux")'.dependencies]
whisper-rs = { version = "0.13.2", features = ["raw-api"] }

[dev-dependencies]
tempfile = "3.3.0"

[workspace]
resolver = "2"
members = [
    "crates/tingskriver-core",
    "crates/tingskriver-app",
    "crates/tingskriver-overlay",
    "frontend/src-tauri",
    "llama-helper"
]

# Shared workspace settings
[workspace.package]
version = "0.5.0-dev.2"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/mahope/tingskriver"

# Shared dependencies that can be inherited by workspace members
[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32.0", features = ["full"] }

[profile.release]
lto = "thin"
codegen-units = 1
# File and line numbers in panic backtraces and crash dumps, at a fraction of
# the size of full debug info.
debug = "line-tables-only"
# The debug info goes to a separate file (tingskriver.pdb next to the exe on
# Windows), not into the exe. `strip = true` must stay off: on MSVC it makes
# rustc link with /DEBUG:NONE, and then no PDB is written at all.
split-debuginfo = "packed"
strip = "none"
# A panicking tokio task must not take the whole app down.
panic = "unwind"
